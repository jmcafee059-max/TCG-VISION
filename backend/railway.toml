[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn server:api --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = "8000"
PYTHON_VERSION = "3.11"
MONGO_URL = "mongodb://localhost:27017"
DB_NAME = "poke_scan"
